apply plugin: 'com.android.application'

android {
    namespace 'com.siberiadante.multiscrolldemo'
    compileSdk 34
    defaultConfig {
        applicationId "com.siberiadante.multiscrolldemo"
        minSdk 17
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    
    }
}

repositories {
    maven {
        url 'https://maven.aliyun.com/repository/public'
        content { includeGroup 'com.scwang.smartrefresh'; includeGroup 'com.jude' }
    }
    maven { url 'https://jitpack.io' }
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.1'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.1'
    implementation 'com.scwang.smartrefresh:SmartRefreshLayout:1.0.4-4'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.jakewharton:butterknife:10.2.3'
//    compile "com.github.SibreiaDante:SiberiaDanteLib:v1.0.8"
    implementation 'de.hdodenhof:circleimageview:2.1.0'
    implementation 'com.jude:easyrecyclerview:4.4.2'
    implementation 'me.codeboy.android:align-text-view:2.3.1'
    implementation 'com.github.hackware1993:MagicIndicator:1.5.0'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'

}




